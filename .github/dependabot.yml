version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]  # until typescript-eslint supports TS >=7.1
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]  # vitest 5 changed its Assertion<R, T> type params;
        # @testing-library/jest-dom's bundled vitest types (and possibly vitest-axe's) still target the
        # old single-param signature, breaking TS builds. Revisit once jest-dom ships updated types.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
