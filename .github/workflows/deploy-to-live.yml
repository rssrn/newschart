name: Deploy to Live

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI status for commit $SHA"

          RUNS=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --paginate --jq '.check_runs[] | select(.name != "build-and-deploy")')

          TOTAL=$(echo "$RUNS" | jq -s 'length')
          if [ "$TOTAL" -eq 0 ]; then
            echo "No CI checks found for $SHA — soft-pass (path-filtered commit)"
            exit 0
          fi

          PENDING=$(echo "$RUNS" | jq -r 'select(.status == "queued" or .status == "in_progress" or .status == "pending") | .name')
          if [ -n "$PENDING" ]; then
            echo "CI is still running for $SHA — cannot deploy yet:"
            echo "$PENDING"
            exit 1
          fi

          FAILED=$(echo "$RUNS" | jq -r 'select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.name): \(.conclusion)"')
          if [ -n "$FAILED" ]; then
            echo "CI checks did not pass for $SHA:"
            echo "$FAILED"
            exit 1
          fi

          echo "All CI checks passed for $SHA — proceeding with deploy"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        timeout-minutes: 5
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Build backend jar
        timeout-minutes: 5
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            ./mvnw -B versions:set -DnewVersion="$VERSION" package -DskipTests
          else
            ./mvnw -B package -DskipTests
          fi

      - name: Connect to Tailscale
        timeout-minutes: 2
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-tags=tag:github-runner

      - name: Back up current jar
        id: backup
        timeout-minutes: 2
        run: |
          set +e
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_HOST }} \
            "test -f /opt/newschart/newschart.jar"
          HAS_EXISTING=$?
          set -e
          if [ "$HAS_EXISTING" -eq 0 ]; then
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
              ${{ secrets.DEPLOY_HOST }} \
              "cp -f /opt/newschart/newschart.jar /opt/newschart/newschart.jar.prev && \
               rm -rf /opt/newschart/frontend.prev && cp -r /opt/newschart/frontend /opt/newschart/frontend.prev && \
               test -f /opt/newschart/newschart.jar.prev && test -s /opt/newschart/newschart.jar.prev && \
               test -d /opt/newschart/frontend.prev"
            echo "done=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_EXISTING" -eq 1 ]; then
            echo "No prior artifacts found — skipping backup (first deploy)"
            echo "done=false" >> "$GITHUB_OUTPUT"
          else
            echo "SSH connection failed (exit $HAS_EXISTING) checking for prior artifacts"
            exit 1
          fi

      - name: Deploy jar and frontend
        timeout-minutes: 3
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10" \
            target/newschart-*.jar \
            ${{ secrets.DEPLOY_HOST }}:/opt/newschart/newschart.jar
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10" \
            frontend/build/ \
            ${{ secrets.DEPLOY_HOST }}:/opt/newschart/frontend/

      - name: Restart service
        timeout-minutes: 1
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_HOST }} \
            "sudo systemctl restart newschart && sudo systemctl status newschart --no-pager"

      - name: Smoke test
        timeout-minutes: 2
        run: |
          BASE="https://newschart.rossarnold.uk"
          echo "Waiting for service to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/news/availableDays?source=NEW_YORK_TIMES")
            if [ "$STATUS" = "200" ]; then
              echo "Backend up (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 3s"
            sleep 3
            if [ "$i" = "12" ]; then
              echo "Smoke test failed: /api/news/availableDays did not return 200 after 12 attempts"
              exit 1
            fi
          done

          # Check frontend index.html
          echo "Checking frontend index.html..."
          RESP=$(curl -si "$BASE/")
          INDEX_STATUS=$(echo "$RESP" | grep -m1 "^HTTP" | awk '{print $2}')
          INDEX_CT=$(echo "$RESP" | grep -i "^content-type:" | head -1)
          if [ "$INDEX_STATUS" != "200" ]; then
            echo "FAIL: / returned HTTP $INDEX_STATUS (expected 200)"
            exit 1
          fi
          if ! echo "$INDEX_CT" | grep -qi "text/html"; then
            echo "FAIL: / Content-Type is not text/html: $INDEX_CT"
            exit 1
          fi
          echo "index.html OK (HTTP $INDEX_STATUS, $INDEX_CT)"

          # Resolve the hashed JS bundle from index.html and check it loads with a JS content-type
          echo "Checking hashed JS bundle..."
          INDEX_BODY=$(curl -s "$BASE/")
          JS_PATH=$(echo "$INDEX_BODY" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$JS_PATH" ]; then
            echo "FAIL: could not find hashed JS bundle in index.html"
            exit 1
          fi
          echo "Found bundle: $JS_PATH"
          JS_RESP=$(curl -si "$BASE$JS_PATH")
          JS_STATUS=$(echo "$JS_RESP" | grep -m1 "^HTTP" | awk '{print $2}')
          JS_CT=$(echo "$JS_RESP" | grep -i "^content-type:" | head -1)
          if [ "$JS_STATUS" != "200" ]; then
            echo "FAIL: $JS_PATH returned HTTP $JS_STATUS (expected 200)"
            exit 1
          fi
          if echo "$JS_CT" | grep -qi "text/html"; then
            echo "FAIL: JS bundle served as text/html (SPA fallback instead of asset): $JS_CT"
            exit 1
          fi
          echo "JS bundle OK (HTTP $JS_STATUS, $JS_CT)"

          # Second API endpoint: heatmap aggregation
          echo "Checking statsAllCallouts..."
          STATS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/news/statsAllCallouts")
          if [ "$STATS_STATUS" != "200" ]; then
            echo "FAIL: /api/news/statsAllCallouts returned HTTP $STATS_STATUS (expected 200)"
            exit 1
          fi
          echo "statsAllCallouts OK (HTTP $STATS_STATUS)"

          echo "All smoke tests passed"

      - name: Rollback on failure
        if: failure() && steps.backup.outputs.done == 'true'
        timeout-minutes: 2
        run: |
          echo "Deployment failed — rolling back jar and frontend"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_HOST }} \
            "cp -f /opt/newschart/newschart.jar.prev /opt/newschart/newschart.jar && \
             rm -rf /opt/newschart/frontend && cp -r /opt/newschart/frontend.prev /opt/newschart/frontend && \
             sudo systemctl restart newschart"
          echo "Rollback complete"
