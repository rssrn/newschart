name: Deploy to Live

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Docker build and deploy existing latest image'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI status for commit $SHA"

          for attempt in $(seq 1 20); do
            RUNS=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --paginate --jq '.check_runs[] | select(.name != "publish" and .name != "deploy")')

            TOTAL=$(echo "$RUNS" | jq -s 'length')
            if [ "$TOTAL" -eq 0 ]; then
              echo "No CI checks found for $SHA — soft-pass (path-filtered commit)"
              exit 0
            fi

            PENDING=$(echo "$RUNS" | jq -r 'select(.status == "queued" or .status == "in_progress" or .status == "pending") | .name')
            if [ -n "$PENDING" ]; then
              echo "Attempt $attempt: CI still running — waiting 30s:"
              echo "$PENDING"
              sleep 30
              continue
            fi

            FAILED=$(echo "$RUNS" | jq -r 'select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.name): \(.conclusion)"')
            if [ -n "$FAILED" ]; then
              echo "CI checks did not pass for $SHA:"
              echo "$FAILED"
              exit 1
            fi

            echo "All CI checks passed for $SHA — proceeding"
            exit 0
          done

          echo "Timed out waiting for CI checks after $(( 20 * 30 / 60 )) minutes"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        timeout-minutes: 2
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-tags=tag:github-runner

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Sync deploy config
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          printf 'MONGODB_URI=%s\nGOOGLE_API_KEY=%s\nOPENROUTER_API_KEY=%s\n' \
            "$MONGODB_URI" "$GOOGLE_API_KEY" "$OPENROUTER_API_KEY" > deploy/.env
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10" \
            deploy/ deploy@homelab-infra:/home/deploy/newschart/

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            deploy@homelab-infra \
            "cd /home/deploy/newschart && \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             docker compose pull newschart && \
             docker compose up -d && \
             cp /home/deploy/newschart/nginx.conf /opt/nginx/conf.d/newschart.conf && \
             docker compose -f /opt/homelab-infra/services/nginx/docker-compose.yml exec nginx nginx -s reload"

      - name: Sync Grafana dashboards
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10" \
            grafana/dashboards/*.json \
            deploy@homelab-infra:/opt/grafana/dashboards/apps/newschart/

      - name: Smoke test
        timeout-minutes: 2
        run: |
          BASE="https://newschart.rossarnold.uk"
          echo "Waiting for service to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/news/availableDays?source=NEW_YORK_TIMES")
            if [ "$STATUS" = "200" ]; then
              echo "Backend up (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s"
            sleep 5
            if [ "$i" = "12" ]; then
              echo "Smoke test failed: /api/news/availableDays did not return 200 after 12 attempts"
              exit 1
            fi
          done

          echo "Checking frontend index.html..."
          RESP=$(curl -si "$BASE/")
          INDEX_STATUS=$(echo "$RESP" | grep -m1 "^HTTP" | awk '{print $2}')
          INDEX_CT=$(echo "$RESP" | grep -i "^content-type:" | head -1)
          if [ "$INDEX_STATUS" != "200" ]; then
            echo "FAIL: / returned HTTP $INDEX_STATUS (expected 200)"
            exit 1
          fi
          if ! echo "$INDEX_CT" | grep -qi "text/html"; then
            echo "FAIL: / Content-Type is not text/html: $INDEX_CT"
            exit 1
          fi
          echo "index.html OK (HTTP $INDEX_STATUS, $INDEX_CT)"

          echo "Checking hashed JS bundle..."
          INDEX_BODY=$(curl -s "$BASE/")
          JS_PATH=$(echo "$INDEX_BODY" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$JS_PATH" ]; then
            echo "FAIL: could not find hashed JS bundle in index.html"
            exit 1
          fi
          JS_RESP=$(curl -si "$BASE$JS_PATH")
          JS_STATUS=$(echo "$JS_RESP" | grep -m1 "^HTTP" | awk '{print $2}')
          JS_CT=$(echo "$JS_RESP" | grep -i "^content-type:" | head -1)
          if [ "$JS_STATUS" != "200" ]; then
            echo "FAIL: $JS_PATH returned HTTP $JS_STATUS"
            exit 1
          fi
          if echo "$JS_CT" | grep -qi "text/html"; then
            echo "FAIL: JS bundle served as text/html (SPA fallback fired): $JS_CT"
            exit 1
          fi
          echo "JS bundle OK (HTTP $JS_STATUS, $JS_CT)"

          echo "Checking statsAllCallouts..."
          STATS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/news/statsAllCallouts")
          if [ "$STATS_STATUS" != "200" ]; then
            echo "FAIL: /api/news/statsAllCallouts returned HTTP $STATS_STATUS"
            exit 1
          fi
          echo "statsAllCallouts OK"

          echo "All smoke tests passed"

