name: Deploy to Live

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./mvnw -B versions:set -DnewVersion="$VERSION"

      - name: Build backend jar
        run: ./mvnw -B package -DskipTests

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-tags=tag:github-runner

      - name: Back up current jar
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            newschart@100.103.218.16 \
            "cp -f /opt/newschart/newschart.jar /opt/newschart/newschart.jar.prev 2>/dev/null || true"

      - name: Deploy jar and frontend
        run: |
          # Deploy fat jar (renamed to fixed filename)
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            target/newschart-*.jar \
            newschart@100.103.218.16:/opt/newschart/newschart.jar

          # Deploy frontend build
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            frontend/build/ \
            newschart@100.103.218.16:/opt/newschart/frontend/

      - name: Restart service
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            newschart@100.103.218.16 \
            "sudo systemctl restart newschart && sudo systemctl status newschart --no-pager"

      - name: Smoke test
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://newschart.rossarnold.uk/api/news)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s"
            sleep 10
          done
          echo "Smoke test failed: /api/news did not return 200 after 2 minutes"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Smoke test failed — rolling back to previous jar"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            newschart@100.103.218.16 \
            "cp -f /opt/newschart/newschart.jar.prev /opt/newschart/newschart.jar && sudo systemctl restart newschart"
          echo "Rollback complete"
