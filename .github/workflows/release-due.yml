name: Release Due Check

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily (7am BST in summer)
  workflow_dispatch:

jobs:
  check-release-due:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure release-due label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "release-due" \
            --description "A release should be cut" \
            --color "E11D48" \
            2>/dev/null || true

      - name: Check for existing open release-due issue
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list --label "release-due" --state open --json id --jq length)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Get last release date
        id: last-release
        if: steps.existing.outputs.count == '0'
        run: |
          # The release process is tag-driven (deploy-to-live.yml triggers off `v*` tag
          # pushes) and GitHub Release objects aren't part of it — only one has ever been
          # created across 47+ tags, so `gh release list` is not a reliable source of the
          # last release. The most recent `v*` git tag is the actual source of truth.
          TAG=$(git tag --sort=-creatordate | grep '^v' | head -1)
          if [ -n "$TAG" ]; then
            DATE=$(git log -1 --format=%cI "$TAG")
          else
            TAG="(none)"
            DATE="1970-01-01T00:00:00Z"
          fi
          echo "Last release: tag=${TAG}, date=${DATE}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Evaluate release criteria
        id: criteria
        if: steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_RELEASE_DATE: ${{ steps.last-release.outputs.date }}
          LAST_RELEASE_TAG: ${{ steps.last-release.outputs.tag }}
        run: |
          REASONS_FILE=$(mktemp)
          echo "Last release date: ${LAST_RELEASE_DATE}"

          # Commits "since last release" are found by ancestry (tag..HEAD), not by date.
          # git log --after=<date> treats the boundary as inclusive, which wrongly counts
          # the release commit itself (it shares the tag's exact timestamp) as "since" it.
          if [ "$LAST_RELEASE_TAG" != "(none)" ]; then
            COMMIT_RANGE="${LAST_RELEASE_TAG}..origin/main"
          else
            COMMIT_RANGE="origin/main"
          fi

          # 1. Dependabot security PRs merged since last release
          echo "--- Checking: Dependabot security PRs (gh pr list --search 'author:app/dependabot label:security merged:>${LAST_RELEASE_DATE}')"
          SECURITY_PRS=$(gh pr list \
            --state merged \
            --search "author:app/dependabot label:security merged:>${LAST_RELEASE_DATE}" \
            --limit 100 \
            --json number,title \
            --jq '.[]')
          SECURITY_COUNT=$(echo "$SECURITY_PRS" | jq -s length)
          echo "  -> Found: ${SECURITY_COUNT}"
          if [ "$SECURITY_COUNT" -gt 0 ]; then
            LIST=$(echo "$SECURITY_PRS" | jq -rs '.[] | "- #\(.number) \(.title)"')
            printf '\n### Security dependency updates\n%d security PR(s) merged since last release:\n%s\n' \
              "$SECURITY_COUNT" "$LIST" >> "$REASONS_FILE"
          fi

          # 2. 2+ weeks elapsed with commits on main
          NOW_EPOCH=$(date -u +%s)
          LAST_EPOCH=$(date -d "$LAST_RELEASE_DATE" -u +%s)
          WEEKS_SINCE=$(( (NOW_EPOCH - LAST_EPOCH) / 604800 ))
          echo "--- Checking: weeks elapsed since last release -> ${WEEKS_SINCE} week(s)"
          if [ "$WEEKS_SINCE" -ge 2 ]; then
            COMMIT_COUNT=$(git log --oneline "$COMMIT_RANGE" | wc -l)
            echo "  -> Commits on main since last release: ${COMMIT_COUNT}"
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              printf '\n### Time elapsed\n%d week(s) have passed since the last release with %d commit(s) on main.\n' \
                "$WEEKS_SINCE" "$COMMIT_COUNT" >> "$REASONS_FILE"
            fi
          else
            echo "  -> Skipped (< 2 weeks)"
          fi

          # 3. 5+ routine (non-security) Dependabot PRs merged since last release
          echo "--- Checking: routine Dependabot PRs (gh pr list --search 'author:app/dependabot merged:>${LAST_RELEASE_DATE}')"
          NON_SEC_PRS=$(gh pr list \
            --state merged \
            --search "author:app/dependabot merged:>${LAST_RELEASE_DATE}" \
            --limit 100 \
            --json number,title,labels \
            --jq '[.[] | select(.labels | map(.name) | contains(["security"]) | not)]')
          NON_SEC_COUNT=$(echo "$NON_SEC_PRS" | jq length)
          echo "  -> Found: ${NON_SEC_COUNT} (threshold: 5)"
          if [ "$NON_SEC_COUNT" -ge 5 ]; then
            LIST=$(echo "$NON_SEC_PRS" | jq -r '.[] | "- #\(.number) \(.title)"')
            printf '\n### Dependency accumulation\n%d routine Dependabot PRs merged since last release:\n%s\n' \
              "$NON_SEC_COUNT" "$LIST" >> "$REASONS_FILE"
          fi

          # 4. Any fix: commits on main since last release
          echo "--- Checking: fix: commits on main since last release"
          FIX_COMMITS=$(git log --format="%h %s" "$COMMIT_RANGE" \
            | grep -E "^[0-9a-f]+ fix:" || true)
          if [ -n "$FIX_COMMITS" ]; then
            FIX_COUNT=$(echo "$FIX_COMMITS" | wc -l)
            echo "  -> Found: ${FIX_COUNT}"
            LIST=$(echo "$FIX_COMMITS" | head -10 | sed 's/^/- /')
            printf '\n### Bug fixes\n%d fix: commit(s) on main since last release:\n%s\n' \
              "$FIX_COUNT" "$LIST" >> "$REASONS_FILE"
          else
            echo "  -> Found: 0"
          fi

          if [ -s "$REASONS_FILE" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            {
              echo 'reasons<<REASONS_DELIMITER'
              cat "$REASONS_FILE"
              echo 'REASONS_DELIMITER'
            } >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          rm "$REASONS_FILE"

      - name: Raise release-due issue
        if: steps.criteria.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASONS: ${{ steps.criteria.outputs.reasons }}
        run: |
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'BODY_EOF'
          ## Release recommended

          The automated daily check has identified the following reason(s) to cut a release:
          BODY_EOF
          echo "$REASONS" >> "$BODY_FILE"
          cat >> "$BODY_FILE" <<'BODY_EOF'

          ---
          *Raised automatically by the [Release Due Check](../actions/workflows/release-due.yml) workflow. Close this issue once a release has been cut, or if you decide to defer.*
          BODY_EOF

          gh issue create \
            --title "Release due" \
            --label "release-due" \
            --body-file "$BODY_FILE"
          rm "$BODY_FILE"
