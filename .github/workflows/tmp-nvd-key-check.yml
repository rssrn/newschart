# TEMPORARY diagnostic for #89 — delete once the NVD_API_KEY question is settled.
# Never prints the key. Only reports its length, HTTP status codes and timings.
name: TEMP NVD key check

on:
  workflow_dispatch:

jobs:
  nvd-key-check:
    name: NVD key check
    runs-on: ubuntu-latest

    steps:
      - name: Probe NVD API with and without the secret
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          URL="https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1"

          echo "== secret shape =="
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is EMPTY or unset"
          else
            echo "NVD_API_KEY present, length=${#NVD_API_KEY}  (a valid NVD key is 36 chars)"
            case "$NVD_API_KEY" in
              ????????-????-????-????-????????????) echo "shape: matches UUID layout" ;;
              *) echo "shape: does NOT match UUID layout" ;;
            esac
          fi

          echo
          echo "== single request, with key =="
          curl -s -o /dev/null -w "HTTP %{http_code}  time=%{time_total}s\n" \
            --max-time 60 -H "apiKey: $NVD_API_KEY" "$URL" || echo "curl failed"

          echo
          echo "== burst of 12, WITH key (authenticated tier allows 50/30s) =="
          for i in $(seq 1 12); do
            curl -s -o /dev/null -w "%{http_code} " --max-time 60 -H "apiKey: $NVD_API_KEY" "$URL" || echo -n "ERR "
          done; echo

          echo
          echo "== cooling 35s to clear the rolling window =="
          sleep 35

          echo "== burst of 12, WITHOUT key (control; unauth tier allows 5/30s) =="
          for i in $(seq 1 12); do
            curl -s -o /dev/null -w "%{http_code} " --max-time 60 "$URL" || echo -n "ERR "
          done; echo

          echo
          echo "== throughput: 5 pages x 2000 records, WITH key =="
          echo "(this is the operation the update phase repeats ~180 times)"
          start=$(date +%s)
          for i in 0 2000 4000 6000 8000; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
              -H "apiKey: $NVD_API_KEY" \
              "https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=2000&startIndex=$i")
            echo "  startIndex=$i -> HTTP $code  ($(($(date +%s)-start))s elapsed)"
          done
          total=$(($(date +%s)-start))
          echo "5 pages took ${total}s -> ~180 pages would take ~$((total*36))s"
