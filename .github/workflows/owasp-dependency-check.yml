name: OWASP Dependency Check

on:
  schedule:
    # Twice weekly: a 7 day gap matches GitHub's cache eviction window (#89)
    - cron: '0 2 * * 0,3'  # Sundays and Wednesdays at 02:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache dependency-check data
        uses: actions/cache@v6
        with:
          # must match -DdataDirectory below, which overrides the plugin default
          path: ~/.dependency-check/data
          # run_id never matches, so the entry is always re-saved and stays fresh
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      - name: Run OWASP dependency check
        env:
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
        run: >-
          ./mvnw org.owasp:dependency-check-maven:check
          -Dnvd.api.key=${{ secrets.NVD_API_KEY }}
          -DdataDirectory=$HOME/.dependency-check/data

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
