name: Tailscale Connection Test
on:
  workflow_dispatch: 

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Ping Ubuntu Box
        run: ping -c 4 100.103.218.16
