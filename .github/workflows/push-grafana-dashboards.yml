# @author Claude Sonnet 4.6 Anthropic
name: Push Grafana Dashboards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grafana/dashboards/**'

jobs:
  push-dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-tags=tag:github-runner

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Sync dashboards to Grafana
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10" \
            grafana/dashboards/*.json \
            deploy@homelab-infra:/opt/grafana/dashboards/apps/newschart/
