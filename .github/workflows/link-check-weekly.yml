name: Link Check (Weekly)

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check all links
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >
            --base https://newschart.rossarnold.uk
            --verbose
            --no-progress
            https://newschart.rossarnold.uk
          fail: true
