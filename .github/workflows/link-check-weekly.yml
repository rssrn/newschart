name: Link Check (Weekly)

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check links in source files (strict)
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --exclude '(linkedin|npmjs|claude\.ai|doi\.org|perplexity\.ai|openai\.com|eslint\.org|vitest\.dev|google\.com/s2/favicons)'
            './frontend/src/**/*.tsx'
          fail: true
          output: lychee/out-strict.md

      # These sites block automated crawlers (403/999) but the links are real.
      # This step gives visibility without failing CI — if a URL goes dead and
      # starts returning something other than its usual bot-block code it will
      # appear as an error in the job summary.
      # eslint.org and vitest.dev are excluded from both steps: they reset
      # connections at the network level (OS error 104) rather than returning
      # a 403/999, so --accept cannot suppress them. Links are stable enough to skip.
      - name: Check bot-blocking links (visibility only, non-failing)
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept 403,999
            'https://www.linkedin.com/in/rarnold/'
            'https://www.npmjs.com/package/vitest-axe'
            'https://claude.ai/'
            'https://doi.org/10.1145/212332.212334'
            'https://www.perplexity.ai/'
            'https://openai.com/chatgpt'
          fail: false
          output: lychee/out-permissive.md
