name: Link Check (Weekly)

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check all links in source files
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            './frontend/src/**/*.tsx'
          fail: true
