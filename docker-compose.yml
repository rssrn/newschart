# @author Claude Opus 4.6 Anthropic
services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    mem_limit: 512m

  newschart:
    build: .
    image: newschart:local
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/newschart
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - mongodb
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v2.45.3
    profiles: ["monitoring"]
    ports:
      - "9091:9091"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9091'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    mem_limit: 200m

  grafana:
    image: grafana/grafana:12.4.2
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # local dev only
    mem_limit: 200m

  grafana-watcher:
    build: ./grafana/watcher
    profiles: ["monitoring"]
    volumes:
      - ./grafana/dashboards:/dashboards
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USER=admin
      - GRAFANA_PASSWORD=admin
    depends_on:
      - grafana
    mem_limit: 20m

  node-exporter:
    image: prom/node-exporter:v1.7.0
    profiles: ["monitoring"]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    mem_limit: 50m

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
