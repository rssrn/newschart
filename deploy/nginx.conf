server {
    listen 80;
    server_name newschart.rossarnold.uk;

    # Prometheus scrapes actuator container-to-container on the proxy network,
    # and the container healthcheck hits it on localhost, so neither traverses
    # nginx. Without this the catch-all below would publish /actuator/prometheus
    # and /actuator/health to the internet. 404 rather than 403 so the path
    # does not advertise that anything is there. Matched without a trailing
    # slash, and with ^~ so it wins outright: bare /actuator serves a discovery
    # index listing every endpoint, and /actuator/ alone would let it through.
    location ^~ /actuator {
        return 404;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream newschart:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ferrtrap/ {
        resolver 127.0.0.11 valid=30s;
        set $ferrtrap_upstream ferrtrap:8085;
        client_max_body_size 4k;
        # ingest zone defined in homelab-infra's services/nginx/conf.d/00-rate-limits.conf
        limit_req zone=ingest burst=10 nodelay;
        # proxy_pass with a variable upstream disables nginx's normal
        # location-prefix stripping, so /ferrtrap/stamp would otherwise be
        # forwarded verbatim to ferrtrap, which only routes /stamp.
        rewrite ^/ferrtrap/(.*)$ /$1 break;
        proxy_pass http://$ferrtrap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
