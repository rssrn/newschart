services:
  newschart:
    image: ghcr.io/rssrn/newschart:latest
    environment:
      - SPRING_MONGODB_URI=${MONGODB_URI}
      - SPRING_MONGODB_DATABASE=newschart-prod
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  proxy:
    external: true
