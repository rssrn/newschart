services:
  newschart:
    image: ghcr.io/rssrn/newschart:latest
    environment:
      - SPRING_MONGODB_URI=${MONGODB_URI}
      - SPRING_MONGODB_DATABASE=newschart-prod
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
